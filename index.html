<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图书馆阅览座位预约系统 - UI 原型</title>
<style>
/* ============================================================
 * 01. 设计变量（Design Tokens）
 * ============================================================ */
:root{
  --primary:#2563eb;
  --primary-dark:#1e40af;
  --teal:#0d9488;
  --success:#16a34a;
  --warning:#f59e0b;
  --danger:#ef4444;
  --info:#3b82f6;
  --grad-main:linear-gradient(135deg,#2563eb,#0d9488);
  --bg:#f1f5f9;
  --card:#ffffff;
  --border:#e2e8f0;
  --text:#0f172a;
  --muted:#64748b;
  --radius:16px;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(15,23,42,.06);
  --shadow-lg:0 2px 4px rgba(0,0,0,.06),0 16px 40px rgba(15,23,42,.12);
  --ring:0 0 0 2px rgba(37,99,235,.35);
  --transition:all .18s ease;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:
    radial-gradient(1200px 500px at 85% -10%,rgba(37,99,235,.06),transparent 60%),
    radial-gradient(900px 400px at -10% 30%,rgba(13,148,136,.06),transparent 55%),
    var(--bg);
  color:var(--text);font-size:14px;line-height:1.65;
}
a{color:var(--primary);text-decoration:none}
button{font-family:inherit;cursor:pointer}
.hidden{display:none !important}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:4px}
[onclick]{cursor:pointer}

/* 滚动条美化 */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:10px}
::-webkit-scrollbar-thumb:hover{background:#94a3b8}
::-webkit-scrollbar-track{background:transparent}

/* ============================================================
 * 02. 按钮
 * ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border:none;
  border-radius:10px;font-size:14px;font-weight:600;transition:var(--transition);background:var(--primary);color:#fff;
  position:relative;overflow:hidden;
}
.btn:hover{background:var(--primary-dark);transform:translateY(-1px);box-shadow:0 6px 16px rgba(37,99,235,.3)}
.btn:active{transform:translateY(0)}
.btn.block{width:100%}
.btn.ghost{background:#fff;border:1px solid var(--border);color:var(--text)}
.btn.ghost:hover{background:#f8fafc;box-shadow:0 4px 12px rgba(0,0,0,.08);transform:none}
.btn.green{background:var(--success)}.btn.green:hover{background:#15803d;box-shadow:0 6px 16px rgba(22,163,74,.3)}
.btn.amber{background:var(--warning);color:#fff}.btn.amber:hover{background:#d97706}
.btn.red{background:var(--danger)}.btn.red:hover{background:#b91c1c;transform:none;box-shadow:0 4px 12px rgba(239,68,68,.25)}
.btn.teal{background:var(--teal)}.btn.teal:hover{background:#0f766e}
.btn.sm{padding:6px 12px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
/* 渐变按钮微光扫过 */
.btn-grad{background:var(--grad-main);background-size:140% 100%;transition:var(--transition)}
.btn-grad:hover{background-position:100% 0;box-shadow:0 6px 16px rgba(37,99,235,.32);transform:translateY(-1px)}

/* ============================================================
 * 03. 登录页（左右分栏）
 * ============================================================ */
.login-wrap{
  min-height:100vh;display:flex;
  background:linear-gradient(135deg,#0f172a,#1e3a8a 40%,#0d9488);
  position:relative;overflow:hidden;
}
.login-wrap::before{
  content:'';position:absolute;width:520px;height:520px;border-radius:50%;
  background:radial-gradient(circle,rgba(13,148,136,.35),transparent 70%);
  top:-160px;right:-120px;filter:blur(20px);
}
.login-wrap::after{
  content:'';position:absolute;width:420px;height:420px;border-radius:50%;
  background:radial-gradient(circle,rgba(37,99,235,.4),transparent 70%);
  bottom:-140px;left:-100px;filter:blur(20px);
}
.login-left{
  flex:1;display:flex;flex-direction:column;justify-content:center;
  padding:60px 70px;color:#fff;position:relative;z-index:1;
}
.ll-brand{display:flex;align-items:center;gap:18px;margin-bottom:26px}
.ll-logo{
  width:64px;height:64px;border-radius:18px;background:rgba(255,255,255,.14);
  backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.25);
  display:flex;align-items:center;justify-content:center;font-size:32px;
}
.ll-title{
  font-size:32px;font-weight:800;line-height:1.2;
  background:linear-gradient(90deg,#fff,#a5f3fc,#6ee7b7);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.ll-sub{font-size:14px;color:#cbd5e1;margin-top:4px;letter-spacing:.5px}
.ll-features{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:32px}
.ll-chip{
  font-size:13px;padding:7px 16px;border-radius:20px;background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(6px);
}
.ll-art{display:grid;grid-template-columns:repeat(6,34px);gap:12px;max-width:320px}
.ll-seat{
  width:34px;height:34px;border-radius:8px;background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.22);opacity:.45;transition:var(--transition);
}
.ll-seat.hot{background:linear-gradient(135deg,rgba(37,99,235,.85),rgba(13,148,136,.85));border-color:transparent;opacity:1;box-shadow:0 0 14px rgba(110,231,183,.35)}
.login-right{
  width:480px;max-width:92vw;display:flex;align-items:center;justify-content:center;
  padding:28px;position:relative;z-index:1;background:rgba(255,255,255,.05);
  backdrop-filter:blur(20px);border-left:1px solid rgba(255,255,255,.12);
}
.login-card{
  width:100%;background:rgba(255,255,255,.96);backdrop-filter:blur(20px);
  border-radius:20px;padding:38px 34px;box-shadow:0 24px 60px rgba(0,0,0,.3);
}
.login-card .brand-title{font-size:20px;font-weight:800;color:var(--text)}
.login-card .sub{color:var(--muted);margin:4px 0 24px;font-size:13px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:500}
.field input,.field select,.field textarea{
  width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;font-size:14px;outline:none;
  transition:var(--transition);background:#fff;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:var(--ring)}
/* 角色切换（滑动指示器） */
.role-tabs{position:relative;display:flex;background:#f1f5f9;border-radius:12px;padding:4px;margin-bottom:22px}
.role-indicator{
  position:absolute;top:4px;bottom:4px;left:4px;width:50%;border-radius:9px;background:#fff;
  box-shadow:0 2px 8px rgba(0,0,0,.1);transition:all .25s cubic-bezier(.4,0,.2,1);
}
.role-tab{flex:1;position:relative;z-index:1;padding:10px;border:none;background:none;text-align:center;font-size:14px;color:var(--muted);transition:color .2s;border-radius:9px}
.role-tab.active{color:var(--primary);font-weight:700}
.login-hint{font-size:12px;color:var(--muted);margin-top:18px;text-align:center;line-height:1.9}

/* ============================================================
 * 04. 应用布局
 * ============================================================ */
.app{display:flex;min-height:100vh}
.sidebar{
  width:236px;background:linear-gradient(180deg,#0f172a,#1e293b);color:#cbd5e1;flex-shrink:0;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.sidebar .brand{
  padding:22px 20px;font-size:16px;font-weight:700;color:#fff;display:flex;align-items:center;gap:10px;
  border-bottom:1px solid #1e293b;
}
.sidebar .brand .dot{
  width:34px;height:34px;border-radius:10px;background:var(--grad-main);
  display:flex;align-items:center;justify-content:center;font-size:17px;box-shadow:0 4px 12px rgba(37,99,235,.4);
}
.sidebar nav{flex:1;padding:12px 0;overflow-y:auto}
.nav-group{
  padding:14px 20px 6px;font-size:12px;letter-spacing:1px;color:#64748b;font-weight:700;
  display:flex;align-items:center;gap:8px;
}
.bonus-tag{font-size:10px;background:rgba(245,158,11,.18);color:#fbbf24;padding:1px 8px;border-radius:20px;letter-spacing:0}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:11px 20px;color:#94a3b8;font-size:14px;cursor:pointer;
  transition:var(--transition);border-left:3px solid transparent;
}
.nav-item:hover{background:#1e293b;color:#fff}
.nav-item.active{background:linear-gradient(90deg,rgba(37,99,235,.18),transparent);color:#fff;border-left-color:var(--primary)}
.nav-ico{
  width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.08);
  display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;transition:var(--transition);
}
.nav-item:hover .nav-ico{background:rgba(255,255,255,.14)}
.nav-item.active .nav-ico{background:var(--grad-main);box-shadow:0 0 0 2px rgba(37,99,235,.22)}
.msg-badge{
  margin-left:auto;min-width:18px;height:18px;border-radius:9px;background:var(--danger);color:#fff;
  font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px;
}
/* 侧边栏底部用户卡片 */
.sidebar .foot{padding:16px 18px;border-top:1px solid #1e293b}
.user-card{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:rgba(255,255,255,.05);margin-bottom:12px}
.avatar{
  width:42px;height:42px;border-radius:50%;background:var(--grad-main);color:#fff;font-weight:800;
  display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;
  box-shadow:0 4px 12px rgba(37,99,235,.35);border:1px solid rgba(255,255,255,.5);
}
.uname{font-size:14px;color:#fff;font-weight:600}
.role-tag{font-size:11px;background:var(--primary);color:#fff;padding:1px 8px;border-radius:20px;margin-left:6px;font-weight:400}
.uid{font-size:12px;color:#64748b;margin-top:2px}
.logout-btn{width:100%;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);color:#fca5a5;border-radius:10px;padding:9px;font-size:13px;font-weight:600;transition:var(--transition)}
.logout-btn:hover{background:rgba(239,68,68,.25);color:#fff}
.foot-btn{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);color:#94a3b8;border-radius:10px;padding:8px;font-size:12px;font-weight:600;transition:var(--transition);margin-top:8px}
.foot-btn:hover{background:rgba(255,255,255,.1);color:#e2e8f0}
.version{font-size:11px;color:#475569;text-align:center;margin-top:10px}

.main{flex:1;padding:26px 30px;overflow:auto;min-width:0}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:22px;gap:16px;flex-wrap:wrap}
.title-row{display:flex;align-items:center;gap:12px}
.topbar h2{font-size:22px;font-weight:800}
.topbar .crumb{color:var(--muted);font-size:12px;margin-top:3px}
.topbar-actions{display:flex;gap:10px}
.badge{font-size:12px;font-weight:700;padding:3px 12px;border-radius:20px;display:inline-flex;align-items:center;gap:4px}
.badge.ok{background:#dcfce7;color:#15803d}
.badge.info{background:#dbeafe;color:#1d4ed8}
.badge.amber{background:#fef3c7;color:#b45309}

/* 黑名单横幅 */
.bl-banner{
  background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;padding:12px 16px;border-radius:12px;
  margin-bottom:16px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;
}

/* ============================================================
 * 05. 卡片（顶部渐变条仅在 hover 显示）
 * ============================================================ */
.card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:20px;margin-bottom:18px;position:relative;transition:box-shadow .2s;
}
.card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;border-radius:16px 16px 0 0;
  background:var(--grad-main);opacity:0;transform:scaleX(.4);transform-origin:left;
  transition:opacity .25s,transform .25s;
}
.card:hover{box-shadow:var(--shadow-lg)}
.card:hover::before{opacity:1;transform:scaleX(1)}
.card h3{font-size:15px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.grid{display:grid;gap:16px}
.stat-grid{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}

/* 统计卡：顶部 3px 渐变细线，数字降饱和 */
.stat{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;
  box-shadow:var(--shadow);position:relative;overflow:hidden;transition:box-shadow .2s;
}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--grad-main);opacity:.7}
.stat:hover{box-shadow:var(--shadow-lg)}
.stat .num{
  font-size:30px;font-weight:800;line-height:1.15;
  background:linear-gradient(135deg,#3b6bd6,#2a9188);-webkit-background-clip:text;background-clip:text;color:transparent;
}
.stat.green .num{background:linear-gradient(135deg,#2a9d57,#63c47e);-webkit-background-clip:text;background-clip:text}
.stat.amber .num{background:linear-gradient(135deg,#e0a12f,#f0c050);-webkit-background-clip:text;background-clip:text}
.stat.red .num{background:linear-gradient(135deg,#d95b5b,#ef8a8a);-webkit-background-clip:text;background-clip:text}
.stat.teal .num{background:linear-gradient(135deg,#24908a,#52bfb2);-webkit-background-clip:text;background-clip:text}
.stat .lbl{color:var(--muted);font-size:13px;margin-top:4px}
.stat .delta{font-size:12px;margin-top:6px;font-weight:600}
.delta.up{color:var(--success)}.delta.down{color:var(--danger)}

/* 筛选 */
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;align-items:center}
.filters select,.filters input{
  padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:#fff;outline:none;transition:var(--transition);
}
.filters select:focus{border-color:var(--primary)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600}
.pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0}
.pill.free{background:#dcfce7;color:#15803d}
.pill.reserved{background:#fef3c7;color:#b45309}
.pill.inuse{background:#fee2e2;color:#b91c1c}
.pill.pending{background:#fef3c7;color:#b45309}
.pill.ok{background:#dcfce7;color:#15803d}
.pill.bad{background:#fee2e2;color:#b91c1c}
.pill.gray{background:#e2e8f0;color:#475569}

/* ============================================================
 * 06. 座位网格（SVG 图标 / 角标左上 / hover 1.02）
 * ============================================================ */
.seat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:12px}
.seat{
  border:1.5px solid var(--border);border-radius:14px;padding:14px 10px;text-align:center;cursor:pointer;
  background:#fff;transition:var(--transition);position:relative;
}
.seat:hover{transform:translateY(-1px) scale(1.02);box-shadow:var(--shadow-lg);z-index:1}
.seat .no{font-size:16px;font-weight:800;margin-top:6px}
.seat .zone{font-size:11px;color:var(--muted);margin-top:2px}
.seat .st{font-size:12px;margin-top:8px}
.seat .seat-ico{line-height:1;color:var(--muted)}
.seat .seat-ico svg{display:block;margin:0 auto}
/* 状态角标（左上） */
.seat .dot{position:absolute;top:8px;left:8px;width:9px;height:9px;border-radius:50%}
.seat.free{background:linear-gradient(180deg,#f0fdf4,#fff);border-color:#bbf7d0}
.seat.free .dot{background:var(--success);box-shadow:0 0 0 3px rgba(22,163,74,.15)}
.seat.free .seat-ico{color:var(--success)}
.seat.free .st{color:var(--success)}
.seat.reserved{background:linear-gradient(180deg,#fffbeb,#fff);border-color:#fde68a}
.seat.reserved .dot{background:var(--warning);box-shadow:0 0 0 3px rgba(245,158,11,.15)}
.seat.reserved .seat-ico{color:#d97706}
.seat.reserved .st{color:#d97706}
.seat.inuse{background:linear-gradient(180deg,#fef2f2,#fff);border-color:#fecaca}
.seat.inuse .dot{background:var(--danger);box-shadow:0 0 0 3px rgba(239,68,68,.15)}
.seat.inuse .seat-ico{color:var(--danger)}
.seat.inuse .st{color:var(--danger)}
.seat.disabled{cursor:not-allowed;opacity:.72}
.seat.selected{border:2px solid var(--primary);box-shadow:0 0 0 4px rgba(37,99,235,.2),var(--shadow-lg)}
/* 我的座位脉冲 */
.seat.mine{animation:pulse 1.6s ease-in-out infinite;border-color:var(--primary)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(37,99,235,.35)}50%{box-shadow:0 0 0 8px rgba(37,99,235,0)}}
.mine-tag{position:absolute;top:6px;right:8px;font-size:10px;background:var(--primary);color:#fff;padding:1px 7px;border-radius:10px}
.legend{display:flex;gap:18px;margin-bottom:14px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.legend .sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.legend .sw.free{background:var(--success)}.legend .sw.reserved{background:var(--warning)}.legend .sw.inuse{background:var(--danger)}

/* ============================================================
 * 07. 表格
 * ============================================================ */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:12px;text-align:left;border-bottom:1px solid var(--border)}
th{color:var(--muted);font-weight:600;font-size:12px;background:#f8fafc;border-bottom:1px solid rgba(37,99,235,.4)}
td:first-child{border-left:3px solid transparent}
tbody tr:nth-child(even){background:#f8fafc}
tbody tr{transition:background .15s}
tbody tr:hover{background:#f1f5f9}
tbody tr:hover td:first-child{border-left-color:var(--primary)}
.actions{display:flex;gap:6px;flex-wrap:wrap}

/* ============================================================
 * 08. 弹窗
 * ============================================================ */
.modal-mask{
  position:fixed;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;
  animation:fadeIn .2s ease;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  background:#fff;border-radius:16px;width:500px;max-width:100%;max-height:90vh;overflow:auto;
  box-shadow:0 24px 60px rgba(0,0,0,.3);animation:pop .22s cubic-bezier(.4,0,.2,1);
}
.modal::before{content:'';display:block;height:2px;background:var(--grad-main);position:sticky;top:0;z-index:3}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:scale(1);opacity:1}}
.modal .m-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:2px;background:#fff;z-index:2}
.modal .m-head h3{font-size:16px}
.modal .m-body{padding:20px 22px}
.modal .m-foot{padding:16px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;position:sticky;bottom:0;background:#fff}
.close-x{background:none;border:none;font-size:22px;color:var(--muted);line-height:1;padding:0 6px;border-radius:8px;transition:var(--transition)}
.close-x:hover{color:var(--danger);background:#fef2f2}

/* 时间段选择 */
.slots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.slot{border:1.5px solid var(--border);border-radius:10px;padding:12px;cursor:pointer;text-align:center;transition:var(--transition);background:#fff}
.slot:hover{border-color:var(--primary);transform:translateY(-1px)}
.slot.active{border-color:var(--primary);background:#eff6ff;color:var(--primary);font-weight:600;box-shadow:var(--ring)}
.slot .t{font-weight:600}
.slot .d{font-size:11px;color:var(--muted);margin-top:2px}
.holiday-tag{
  font-size:12px;color:#0f766e;background:#ccfbf1;border:1px solid #99f6e4;border-radius:8px;
  padding:6px 10px;margin-bottom:12px;display:flex;align-items:center;gap:6px;
}

/* ============================================================
 * 09. 图表 / 排行榜
 * ============================================================ */
.bar-row{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.bar-row .name{width:120px;font-size:13px;color:var(--muted);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{flex:1;height:22px;background:#f1f5f9;border-radius:6px;overflow:hidden}
.bar-fill{height:100%;background:var(--grad-main);border-radius:6px;color:#fff;font-size:11px;display:flex;align-items:center;padding-left:8px;white-space:nowrap;min-width:30px;transition:width .6s ease}

/* ============================================================
 * 10. Toast
 * ============================================================ */
.toast-wrap{position:fixed;top:20px;right:20px;z-index:300;display:flex;flex-direction:column;gap:10px}
.toast{
  background:#0f172a;color:#fff;padding:12px 18px;border-radius:12px;font-size:13px;box-shadow:var(--shadow-lg);
  animation:slideIn .3s ease;display:flex;align-items:center;gap:10px;max-width:340px;position:relative;overflow:hidden;
}
.toast::after{content:'';position:absolute;bottom:0;left:0;height:3px;width:100%;background:var(--grad-main);animation:tprogress 2.6s linear forwards}
@keyframes tprogress{from{width:100%}to{width:0}}
@keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}
.toast.ok{background:var(--success)}.toast.warn{background:var(--warning)}.toast.err{background:var(--danger)}.toast.info{background:var(--info)}
.t-ico{
  width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.25);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:12px;
}

/* ============================================================
 * 11. 空状态
 * ============================================================ */
.empty{text-align:center;color:var(--muted);padding:46px 0}
.empty-emoji{font-size:52px;margin-bottom:12px;animation:fadeInUp .4s ease}
@keyframes fadeInUp{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.empty-text{font-size:14px;margin-bottom:14px}
.mt{margin-top:14px}
.tag-zone{font-size:11px;background:#e0e7ff;color:#3730a3;padding:2px 8px;border-radius:6px;margin-left:8px}
.tag-floor{font-size:11px;background:#e2e8f0;color:#475569;padding:2px 8px;border-radius:6px;margin-left:6px}
.note{font-size:12.5px;color:var(--muted);background:#f8fafc;border-left:3px solid var(--primary);padding:12px 16px;border-radius:0 10px 10px 0;margin-bottom:16px;line-height:1.7}

/* ============================================================
 * 12. 业务规则卡片 / 扩展页面
 * ============================================================ */
.rules-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.rule-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;
  box-shadow:var(--shadow);transition:var(--transition);border-top:3px solid var(--primary);
}
.rule-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.rule-card .rc-head{display:flex;align-items:center;gap:10px;font-weight:700;margin-bottom:10px;font-size:15px}
.rule-card .rc-ico{font-size:22px}
.rule-card ul{list-style:none;padding:0}
.rule-card li{padding:6px 0 6px 20px;position:relative;color:var(--muted);font-size:13px}
.rule-card li::before{content:'•';position:absolute;left:6px;color:var(--primary);font-weight:800}
.rc-blue{border-top-color:var(--primary)}.rc-teal{border-top-color:var(--teal)}
.rc-green{border-top-color:var(--success)}.rc-amber{border-top-color:var(--warning)}.rc-red{border-top-color:var(--danger)}
.switch-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--border)}
.switch-row:last-child{border-bottom:none}
.switch{position:relative;width:46px;height:26px;border-radius:20px;background:#cbd5e1;cursor:pointer;transition:var(--transition);border:none;flex-shrink:0}
.switch.on{background:var(--primary)}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:var(--transition);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch.on::after{left:23px}
.queue-card{display:flex;align-items:center;gap:14px;padding:16px;border:1px solid var(--border);border-radius:14px;margin-bottom:12px;background:#fff;transition:var(--transition);cursor:pointer}
.queue-card:hover{box-shadow:var(--shadow)}
.queue-rank{width:34px;height:34px;border-radius:10px;background:var(--grad-main);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.msg-item{display:flex;gap:12px;padding:14px;border:1px solid var(--border);border-radius:12px;margin-bottom:10px;background:#fff;transition:var(--transition)}
.msg-item:hover{box-shadow:var(--shadow)}
.msg-item.unread{border-left:3px solid var(--primary);background:#f8faff}
.msg-ico{font-size:20px;flex-shrink:0;margin-top:2px}
.msg-body{flex:1}
.msg-t{font-weight:600;font-size:13px}
.msg-d{font-size:12px;color:var(--muted);margin-top:2px}
.msg-time{font-size:11px;color:#94a3b8;white-space:nowrap}
.points-hero{text-align:center;padding:28px;background:var(--grad-main);border-radius:16px;color:#fff;margin-bottom:18px}
.points-hero .pts{font-size:44px;font-weight:800;line-height:1}
.points-hero .lvl{margin-top:8px;font-size:14px;opacity:.9}
.lvl-bar{height:8px;background:rgba(255,255,255,.3);border-radius:10px;margin:12px auto 0;max-width:280px;overflow:hidden}
.lvl-fill{height:100%;background:#fff;border-radius:10px}

/* ============================================================
 * 13. AI 悬浮球
 * ============================================================ */
.ai-fab{
  position:fixed;right:24px;bottom:24px;width:58px;height:58px;border-radius:50%;background:var(--grad-main);
  color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:0 10px 28px rgba(37,99,235,.45);z-index:90;border:none;transition:var(--transition);
}
.ai-fab:hover{transform:scale(1.08)}
.ai-chat{
  position:fixed;right:24px;bottom:92px;width:350px;height:470px;max-width:90vw;background:#fff;border-radius:18px;
  box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;z-index:91;overflow:hidden;
  animation:pop .22s cubic-bezier(.4,0,.2,1);
}
.ai-head{background:var(--grad-main);color:#fff;padding:14px 18px;font-weight:700;display:flex;align-items:center;justify-content:space-between}
.ai-head button{background:none;border:none;color:#fff;font-size:20px;cursor:pointer}
.ai-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:#f8fafc}
.bubble{max-width:80%;padding:10px 14px;border-radius:14px;font-size:13px;line-height:1.6;white-space:pre-wrap}
.bubble.bot{background:#fff;border:1px solid var(--border);align-self:flex-start;border-bottom-left-radius:4px}
.bubble.user{background:var(--primary);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.ai-quick{display:flex;flex-wrap:wrap;gap:8px;padding:0 4px}
.ai-quick button{font-size:12px;padding:6px 12px;border-radius:16px;border:1px solid var(--border);background:#fff;color:var(--primary);cursor:pointer;transition:var(--transition)}
.ai-quick button:hover{background:#eff6ff;border-color:var(--primary)}
.ai-input{display:flex;gap:8px;padding:12px;border-top:1px solid var(--border)}
.ai-input input{flex:1;padding:9px 12px;border:1px solid var(--border);border-radius:10px;font-size:13px;outline:none}
.ai-input input:focus{border-color:var(--primary)}
.typing{color:var(--muted);font-size:12px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}

/* ============================================================
 * 14. 原型说明 tabs
 * ============================================================ */
.about-tabs{display:flex;gap:8px;margin-bottom:16px}
.about-tab{padding:8px 16px;border-radius:10px;border:1px solid var(--border);background:#fff;font-size:13px;font-weight:600;color:var(--muted);transition:var(--transition)}
.about-tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}

/* ============================================================
 * 15. 打印样式
 * ============================================================ */
@media print{
  .sidebar,.topbar-actions,.ai-fab,.ai-chat,.toast-wrap,.modal-mask,.btn,.logout-btn,.foot-btn{display:none !important}
  .app{display:block}
  .main{padding:0}
  body{background:#fff}
  .card,.stat{border:1px solid #ddd;box-shadow:none;break-inside:avoid}
  .card::before,.stat::before{display:none}
  th{background:#eee;border-bottom:1px solid #999}
}
@media (max-width:900px){
  .login-left{display:none}
  .login-right{width:100%;border-left:none}
}


/* ============================================================
   Visual refinement layer — presentation only; no JS or business logic changed
   ============================================================ */
:root {
  --primary: #3157c8;
  --primary-dark: #2445a8;
  --teal: #168b83;
  --grad-main: linear-gradient(135deg, #3157c8 0%, #168b83 100%);
  --bg: #f4f6fb;
  --card: #ffffff;
  --border: #e5e9f2;
  --text: #182338;
  --muted: #738097;
  --radius: 18px;
  --shadow: 0 4px 18px rgba(26, 42, 76, .045), 0 1px 3px rgba(26, 42, 76, .035);
  --shadow-lg: 0 16px 38px rgba(26, 42, 76, .11);
  --ring: 0 0 0 3px rgba(49, 87, 200, .14);
}
html { scroll-behavior: smooth; }
body {
  background:
    radial-gradient(ellipse at 90% 0%, rgba(49,87,200,.055), transparent 34%),
    radial-gradient(ellipse at 0% 55%, rgba(22,139,131,.045), transparent 32%),
    var(--bg);
  letter-spacing: .08px;
}
button, input, select, textarea { font: inherit; }
button { -webkit-tap-highlight-color: transparent; }
::selection { background: rgba(49,87,200,.18); color: var(--text); }

/* Buttons */
.btn {
  min-height: 40px;
  padding: 10px 17px;
  border-radius: 11px;
  font-weight: 650;
  letter-spacing: .1px;
  box-shadow: 0 2px 5px rgba(49,87,200,.08);
}
.btn:hover { box-shadow: 0 8px 18px rgba(49,87,200,.19); }
.btn.ghost {
  box-shadow: none;
  background: rgba(255,255,255,.88);
}
.btn.ghost:hover { border-color: #cbd5e8; background: #f8faff; }
.btn.sm { min-height: 30px; padding: 6px 11px; }
.btn:focus-visible, .logout-btn:focus-visible, .foot-btn:focus-visible {
  outline: 3px solid rgba(49,87,200,.24);
  outline-offset: 2px;
}

/* Login experience */
.login-wrap {
  background:
    radial-gradient(ellipse at 15% 85%, rgba(22,139,131,.28), transparent 34%),
    radial-gradient(ellipse at 80% 10%, rgba(95,126,235,.28), transparent 35%),
    linear-gradient(135deg, #111c36 0%, #1c3568 53%, #126b70 100%);
}
.login-wrap::before { opacity: .8; }
.login-wrap::after { opacity: .7; }
.login-left { padding: clamp(32px, 6vw, 88px); }
.ll-brand { gap: 20px; margin-bottom: 30px; }
.ll-logo {
  width: 70px; height: 70px; border-radius: 22px;
  background: rgba(255,255,255,.11);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 14px 34px rgba(0,0,0,.12);
}
.ll-title { font-size: clamp(27px, 3vw, 38px); letter-spacing: -.8px; }
.ll-sub { margin-top: 10px; color: #c8d7ed; letter-spacing: .7px; }
.ll-features { gap: 10px; margin-bottom: 38px; }
.ll-chip {
  padding: 8px 14px;
  border-radius: 12px;
  background: rgba(255,255,255,.075);
  border-color: rgba(255,255,255,.15);
  color: #e7eefb;
}
.ll-art { gap: 13px; }
.ll-seat { border-radius: 10px; }
.ll-seat.hot { box-shadow: 0 0 22px rgba(110,231,183,.2); }
.login-right {
  width: min(500px, 48vw);
  padding: clamp(22px, 4vw, 48px);
  background: rgba(8,18,40,.13);
}
.login-card {
  padding: clamp(28px, 3.5vw, 42px);
  border: 1px solid rgba(255,255,255,.7);
  border-radius: 24px;
  box-shadow: 0 28px 80px rgba(5,14,34,.24);
}
.login-card .brand-title { font-size: 23px; letter-spacing: -.3px; }
.login-card .sub { margin: 7px 0 26px; }
.field { margin-bottom: 18px; }
.field label { color: #536078; font-weight: 650; }
.field input, .field select, .field textarea {
  min-height: 44px;
  padding: 12px 14px;
  border-radius: 11px;
  border-color: #dfe5ef;
  background: #fbfcff;
}
.field input:focus, .field select:focus, .field textarea:focus {
  background: #fff;
  border-color: var(--primary);
  box-shadow: var(--ring);
}
.role-tabs { padding: 5px; border-radius: 13px; background: #eef1f7; }
.role-indicator { top: 5px; bottom: 5px; border-radius: 9px; box-shadow: 0 2px 8px rgba(30,45,80,.1); }
.role-tab { padding: 11px; }
.login-hint { margin-top: 20px; color: #77839a; }

/* Main app shell and sidebar */
.app { background: transparent; }
.sidebar {
  width: 250px;
  background: linear-gradient(180deg, #17233c 0%, #111c31 100%);
  box-shadow: 8px 0 30px rgba(20,33,58,.055);
  border-right: 1px solid rgba(255,255,255,.04);
}
.sidebar .brand {
  padding: 23px 21px;
  font-size: 15px;
  letter-spacing: .2px;
  border-bottom-color: rgba(255,255,255,.075);
}
.sidebar .brand .dot {
  width: 38px; height: 38px; border-radius: 12px;
  box-shadow: 0 7px 18px rgba(49,87,200,.28);
}
.sidebar nav { padding: 16px 10px; }
.nav-group { padding: 19px 13px 8px; color: #8290a9; }
.nav-item {
  margin: 3px 0;
  padding: 10px 13px;
  gap: 11px;
  border-left: 3px solid transparent;
  border-radius: 0 11px 11px 0;
  color: #aab5c8;
}
.nav-item:hover { background: rgba(255,255,255,.055); }
.nav-item.active {
  background: linear-gradient(90deg, rgba(72,111,226,.24), rgba(72,111,226,.055));
  border-left-color: #7fa2ff;
  color: #fff;
}
.nav-ico {
  width: 31px; height: 31px;
  border-radius: 9px;
  background: rgba(255,255,255,.065);
}
.nav-item.active .nav-ico {
  background: linear-gradient(135deg, #4169dc, #218f9a);
  box-shadow: 0 4px 10px rgba(38,86,194,.22);
}
.sidebar .foot {
  padding: 15px;
  border-top-color: rgba(255,255,255,.08);
}
.user-card {
  padding: 12px 10px;
  background: rgba(255,255,255,.055);
  border: 1px solid rgba(255,255,255,.055);
  border-radius: 13px;
}
.avatar { box-shadow: 0 4px 12px rgba(49,87,200,.24); }
.foot-btn, .logout-btn { min-height: 37px; border-radius: 10px; }
.version { color: #74819a; }

/* Main content */
.main { padding: clamp(20px, 2.4vw, 34px); }
.topbar {
  align-items: center;
  margin-bottom: 25px;
  padding-bottom: 20px;
  border-bottom: 1px solid rgba(222,228,239,.8);
}
.topbar h2 { font-size: clamp(21px, 2vw, 25px); letter-spacing: -.45px; }
.topbar .crumb { margin-top: 5px; color: #8590a4; }
.topbar-actions { flex-wrap: wrap; }
.badge { padding: 5px 11px; border-radius: 8px; font-size: 11px; }
.badge.ok { background: #e5f7ed; color: #198353; }
.badge.info { background: #e9efff; color: #3157c8; }
.badge.amber { background: #fff4dc; color: #a96b0c; }

/* Cards and stats */
.card, .stat, .rule-card {
  border-color: #e6eaf2;
  border-radius: 17px;
  box-shadow: var(--shadow);
}
.card { padding: clamp(17px, 2vw, 23px); margin-bottom: 20px; }
.card::before { height: 3px; border-radius: 17px 17px 0 0; }
.card:hover { box-shadow: 0 12px 30px rgba(26,42,76,.075); }
.card h3 { margin-bottom: 17px; font-size: 15px; letter-spacing: -.1px; }
.grid { gap: 18px; }
.stat {
  padding: 21px;
  background: linear-gradient(150deg, #fff 0%, #fcfdff 100%);
}
.stat::before { height: 3px; opacity: .8; }
.stat .num { font-size: clamp(27px, 2.5vw, 33px); letter-spacing: -.8px; }
.stat .lbl { margin-top: 7px; }
.stat .delta { margin-top: 8px; }

/* Forms and filters */
.filters { gap: 11px; margin-bottom: 18px; }
.filters select, .filters input {
  min-height: 38px;
  padding: 8px 12px;
  border: 1px solid #e0e6f0;
  border-radius: 10px;
  color: #354159;
}
.filters select:focus, .filters input:focus {
  border-color: var(--primary);
  outline: none;
  box-shadow: var(--ring);
}

/* Seat map cards */
.seat-grid { grid-template-columns: repeat(auto-fill, minmax(126px, 1fr)); gap: 13px; }
.seat {
  min-height: 132px;
  padding: 17px 12px 14px;
  border-radius: 15px;
  box-shadow: 0 2px 6px rgba(31,50,87,.025);
}
.seat:hover { transform: translateY(-3px); box-shadow: 0 12px 24px rgba(31,50,87,.09); }
.seat .no { margin-top: 9px; font-size: 17px; letter-spacing: .2px; }
.seat .zone { margin-top: 3px; }
.seat .st { margin-top: 10px; font-weight: 650; }
.seat.free { background: linear-gradient(160deg, #f0fbf5 0%, #fff 78%); border-color: #c8ead7; }
.seat.reserved { background: linear-gradient(160deg, #fff9eb 0%, #fff 78%); border-color: #f3e0b0; }
.seat.inuse { background: linear-gradient(160deg, #fff3f2 0%, #fff 78%); border-color: #f2d1ce; }
.seat.selected { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(49,87,200,.13), 0 12px 25px rgba(31,50,87,.09); }
.legend { gap: 15px; margin-bottom: 17px; }
.legend span { gap: 8px; }
.legend .sw { width: 10px; height: 10px; border-radius: 4px; }

/* Tables */
.table-wrap {
  border: 1px solid #e7ebf3;
  border-radius: 13px;
  background: #fff;
}
table { font-size: 13px; }
th, td { padding: 13px 14px; }
th {
  padding-top: 14px; padding-bottom: 14px;
  color: #69768d;
  background: #f6f8fc;
  font-size: 12px;
  white-space: nowrap;
  border-bottom-color: #e5eaf3;
}
tbody tr:nth-child(even) { background: #fbfcfe; }
tbody tr:hover { background: #f3f6fd; }
td:first-child { border-left-width: 3px; }
.actions { gap: 7px; }

/* Pills and notices */
.pill { padding: 5px 10px; border-radius: 8px; font-size: 11px; }
.pill::before { width: 6px; height: 6px; }
.bl-banner { padding: 14px 17px; border-radius: 13px; }
.note { border-radius: 0 12px 12px 0; background: #f7f9fe; padding: 13px 16px; }
.tag-zone, .tag-floor { border-radius: 7px; padding: 3px 8px; }

/* Modals and time slots */
.modal-mask { background: rgba(13,22,42,.52); backdrop-filter: blur(7px); }
.modal { border: 1px solid rgba(255,255,255,.65); border-radius: 20px; }
.modal .m-head { padding: 20px 23px; }
.modal .m-head h3 { font-size: 17px; }
.modal .m-body { padding: 23px; }
.modal .m-foot { padding: 17px 23px; background: #fcfdff; }
.close-x { width: 32px; height: 32px; }
.slots { gap: 12px; }
.slot { border-radius: 12px; padding: 14px; }
.slot.active { background: #f1f5ff; box-shadow: 0 0 0 2px rgba(49,87,200,.08); }
.holiday-tag { border-radius: 10px; padding: 9px 12px; }

/* Extension pages */
.rules-grid { gap: 18px; }
.rule-card { padding: 21px; border-top-width: 3px; }
.rule-card .rc-head { margin-bottom: 12px; }
.rule-card li { padding-top: 7px; padding-bottom: 7px; }
.switch-row { padding: 16px 0; }
.queue-card { padding: 17px; border-radius: 15px; }
.queue-card:hover { border-color: #d8e1f3; box-shadow: var(--shadow); }
.msg-item { padding: 15px; border-radius: 13px; }
.msg-item.unread { background: #f6f8ff; }
.points-hero { padding: 34px 24px; border-radius: 19px; box-shadow: 0 12px 30px rgba(49,87,200,.16); }

/* AI assistant */
.ai-fab {
  width: 58px; height: 58px;
  border: 3px solid rgba(255,255,255,.88);
  box-shadow: 0 10px 26px rgba(49,87,200,.28);
}
.ai-chat {
  border: 1px solid rgba(225,231,242,.9);
  border-radius: 20px;
  box-shadow: 0 24px 70px rgba(15,27,52,.2);
}
.ai-head { padding: 16px 18px; }
.ai-body { background: #f6f8fc; }
.bubble { padding: 11px 14px; border-radius: 15px; }
.bubble.bot { box-shadow: 0 2px 5px rgba(25,43,78,.025); }
.ai-input { padding: 13px; background: #fff; }
.ai-input input { min-width: 0; border-color: #e1e6f0; }
.ai-input input:focus { box-shadow: var(--ring); }
.ai-quick button { border-radius: 9px; padding: 7px 11px; }

/* Prototype tabs, empty states and feedback */
.about-tabs { flex-wrap: wrap; }
.about-tab { border-radius: 10px; padding: 9px 15px; }
.about-tab.active { box-shadow: 0 4px 10px rgba(49,87,200,.15); }
.empty { padding: 54px 15px; }
.toast-wrap { top: 22px; right: 22px; }
.toast { border-radius: 13px; padding: 13px 17px; }

/* Responsive polish */
@media (max-width: 1100px) {
  .sidebar { width: 220px; }
  .main { padding: 22px; }
  .stat-grid { grid-template-columns: repeat(auto-fit, minmax(155px, 1fr)); }
}
@media (max-width: 900px) {
  .login-left { display: none; }
  .login-right { width: 100%; max-width: 100%; min-height: 100vh; padding: 22px; background: transparent; }
  .login-card { max-width: 440px; margin: auto; }
  .app { display: block; }
  .sidebar { width: 100%; height: auto; min-height: 0; position: relative; }
  .sidebar nav { padding: 8px 10px 12px; }
  .sidebar .foot { padding: 10px 14px; }
  .sidebar .user-card { margin-bottom: 8px; }
  .main { padding: 19px 16px 28px; }
  .topbar { align-items: flex-start; padding-bottom: 16px; margin-bottom: 19px; }
  .topbar-actions { width: 100%; }
}
@media (max-width: 560px) {
  .main { padding: 15px 11px 24px; }
  .topbar h2 { font-size: 20px; }
  .topbar-actions { gap: 7px; }
  .topbar-actions .btn { padding: 8px 10px; font-size: 12px; }
  .card { padding: 15px; border-radius: 14px; }
  .stat { padding: 16px; }
  .stat-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }

// 座位构建：基于 state.rooms
function buildSeats(){
  const seats = [];
  state.rooms.forEach(r=>{
    const roomNo = (r.name.match(/\d+/)||['?'])[0];
    for(let i=1;i<=r.seatCount;i++){
      const zone = r.zones.length===1 ? r.zones[0] : (i<=Math.ceil(r.seatCount/2)?r.zones[0]:r.zones[1]);
      const id = roomNo + '-' + String(i).padStart(2,'0');
      const rnd = (id.charCodeAt(0)+i*7)%100;
      const status = rnd<40 ? 'free' : (rnd<70 ? 'reserved' : (rnd<85 ? 'inuse' : 'free'));
      seats.push({id, floor:r.floor, room:r.name, roomNo, zone, status, holder: status!=='free' ? randomName() : null});
    }
  });
  return seats;
}
function randomName(){
  const names=['张同学','李同学','王同学','赵同学','刘同学','陈同学','杨同学'];
  return names[Math.floor(Math.random()*names.length)];
}
state.seats = buildSeats();

function getFloors(){ return [...new Set(state.rooms.map(r=>+r.floor))].sort((a,b)=>a-b); }
function getRooms(){ return state.rooms.map(r=>r.name); }
function getRoomsByFloor(f){ return state.rooms.filter(r=>+r.floor===+f).map(r=>r.name); }
function roomByName(name){ return state.rooms.find(r=>r.name===name); }

function toast(msg, type='ok'){
  const icons={ok:'✅',warn:'⚠️',err:'❌',info:'ℹ️'};
  const t = document.createElement('div');
  t.className = 'toast '+type;
  t.innerHTML = `<span class="t-ico">${icons[type]||'ℹ️'}</span><span>${msg}</span>`;
  document.getElementById('toastRoot').appendChild(t);
  setTimeout(()=>{ t.style.transition='opacity .3s'; t.style.opacity='0'; setTimeout(()=>t.remove(),300); }, 2600);
}
function openModal(html){
  document.getElementById('modalRoot').innerHTML = `<div class="modal-mask" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`;
}
function closeModal(){
  document.getElementById('modalRoot').innerHTML='';
  state.selectedSeat=null;
  const g=document.getElementById('seatGrid'); if(g) renderSeatGrid();
}
function esc(s){ return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function val(id){ const e=document.getElementById(id); return e?e.value:''; }
function seatById(id){ return state.seats.find(s=>s.id===id); }
function slotById(id){ return TIME_SLOTS.find(s=>s.id===id); }
function statusPill(status){
  const map = {free:['free','空闲'],reserved:['reserved','已预约'],inuse:['inuse','使用中']};
  const [cls,lbl]=map[status]||['gray',status];
  return `<span class="pill ${cls}">${lbl}</span>`;
}
function emptyState(emoji, text, btnText, onClick){
  return `<div class="empty"><div class="empty-emoji">${emoji}</div><div class="empty-text">${text}</div>${btnText?`<button class="btn btn-grad sm" onclick="${onClick}">${btnText}</button>`:''}</div>`;
}
function animateCounts(){
  document.querySelectorAll('[data-target]').forEach(el=>{
    const target=+el.dataset.target; const suffix=el.dataset.suffix||'';
    const dur=800, start=performance.now();
    (function step(now){
      const p=Math.min((now-start)/dur,1);
      el.textContent=Math.round(target*(1-Math.pow(1-p,3)))+suffix;
      if(p<1) requestAnimationFrame(step);
    })(start);
  });
}

/* 座位 SVG 图标（椅子/锁/人） */
function seatIcon(status){
  const svg = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">`;
  if(status==='free') return svg+`<path d="M7 11V6a5 5 0 0 1 10 0v5"/><path d="M5 11h14v2a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-2z"/><path d="M7 15v4M17 15v4"/></svg>`;
  if(status==='reserved') return svg+`<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>`;
  return svg+`<circle cx="12" cy="7" r="3.5"/><path d="M5 20c0-4 3-6 7-6s7 2 7 6"/></svg>`;
}

/* 积分 / 违约 联动 */
function changePoints(action, delta){
  state.points.balance = Math.max(0, state.points.balance + delta);
  state.pointsLog.unshift({action, delta, date: todayStr()});
  const lv = Math.max(1, Math.floor(state.points.balance/100)+1);
  const names = {1:'初来乍到',2:'书虫学徒',3:'书虫达人',4:'阅读大师',5:'图书馆传奇'};
  state.points.level = lv;
  state.points.levelName = names[lv] || '图书馆传奇';
  state.points.next = lv*100;
}
function addViolation(userId, userName, type, desc){
  state.violations.push({id:'V'+(++state.vid), userId, userName, type, desc, date:todayStr(), appeal:'', appealStatus:'none'});
  const cnt = state.violations.filter(v=>v.userId===userId).length;
  if(cnt>=3 && !isBlacklisted(userId)){
    state.blacklist.push({userId, userName, reason:'累计违约 3 次', date:todayStr()});
    toast(userName+' 累计违约 3 次，已自动加入黑名单','err');
  }
}

function renderSeatGrid(){
  const g = document.getElementById('seatGrid'); if(!g) return;
  const fFloor=val('fFloor'), fRoom=val('fRoom'), fZone=val('fZone'), fStatus=val('fStatus');
  const list = state.seats.filter(s=>
    (fFloor==='all'||s.floor==+fFloor) &&
    (fRoom==='all'||s.room===fRoom) &&
    (fZone==='all'||s.zone===fZone) &&
    (fStatus==='all'||s.status===fStatus)
  );
  if(!list.length){ g.innerHTML=`<div style="grid-column:1/-1">${emptyState('🔍','没有符合条件的座位')}</div>`; return; }
  const hasActive = state.reservations.some(r=>r.userId===state.user.id && (r.status==='reserved'||r.status==='inuse'));
  const mine = new Set(state.reservations.filter(r=>r.userId===state.user.id && (r.status==='reserved'||r.status==='inuse')).map(r=>r.seatId));
  g.innerHTML = list.map(s=>{
    const canClick = s.status==='free' && !hasActive;
    const isMine = mine.has(s.id);
    const isSel = state.selectedSeat===s.id;
    return `<div class="seat ${s.status} ${canClick?'':'disabled'} ${isMine?'mine':''} ${isSel?'selected':''}" onclick="${canClick?`openReserve('${s.id}')`:''}">
      ${isMine?'<span class="mine-tag">我的</span>':''}
      <span class="dot"></span>
      <div class="seat-ico">${seatIcon(s.status)}</div>
      <div class="no">${esc(s.id)}</div>
      <div class="zone">${esc(s.zone)} · ${s.floor}F</div>
      <div class="st">${s.status==='free'?'空闲':(s.status==='reserved'?esc(s.holder):'使用中')}</div>
    </div>`;
  }).join('');
}

function openReserve(seatId){
  if(state.user.role==='student' && isBlacklisted(state.user.id)){ toast('您已被加入黑名单，暂停预约资格','err'); return; }
  const s = seatById(seatId); if(!s||s.status!=='free') return;
  state.selectedSeat = seatId; renderSeatGrid();
  const holiday = state.rules.holidayEnabled && state.rules.holidays.includes(todayMMDD());
  openModal(`
    <div class="m-head"><h3>预约座位 ${esc(seatId)}</h3><button class="close-x" onclick="closeModal()">×</button></div>

function pickSlot(el){
  document.querySelectorAll('#rSlots .slot').forEach(s=>s.classList.remove('active'));
  el.classList.add('active');
}
function confirmReserve(seatId){
  const slotEl = document.querySelector('#rSlots .slot.active');
  if(!slotEl){ toast('请选择时间段','warn'); return; }
  const slot = slotById(slotEl.dataset.slot);
  // 夜间规则生效
  if(slot.id==='18-22' && !state.rules.nightEnabled){ toast('夜间预约未开放，请选择其他时段','err'); return; }
  const s = seatById(seatId);
  if(!s || s.status!=='free'){ toast('该座位已被占用','err'); closeModal(); render(); return; }
  s.status='reserved'; s.holder=state.user.name;
  state.reservations.push({id:'R'+(++state.rid), seatId, userId:state.user.id, userName:state.user.name,
    date: val('rDate')==='tomorrow'?'明天':todayStr(), slot, status:'reserved', createdAt:Date.now()});
  state.messages.unshift({id:'M'+Date.now(), type:'预约', title:'预约成功', desc:`您已成功预约座位 ${seatId}（${slot.t}）`, time:'刚刚', unread:true});
  changePoints('完成一次预约', 10);
  toast('预约成功：'+seatId+' '+slot.t+'（积分 +10）');
  closeModal();
  render();
}

function viewStudentReservations(){
  const mine = state.reservations.filter(r=>r.userId===state.user.id).sort((a,b)=>b.createdAt-a.createdAt);
  const rows = mine.map(r=>{
    const actions = [];
    if(r.status==='reserved') actions.push(
      `<button class="btn green sm" onclick="doCheckin('${r.id}')">签到</button>`,
      `<button class="btn amber sm" onclick="doRelease('${r.id}')">取消预约</button>`,
      `<button class="btn red sm" onclick="doTimeout('${r.id}')">超时演示</button>`,
    );
    else if(r.status==='inuse') actions.push(`<button class="btn teal sm" onclick="doRelease('${r.id}')">离开释放</button>`);
    const stMap={reserved:['reserved','待签到'],inuse:['ok','使用中'],done:['gray','已完成'],canceled:['gray','已取消'],expired:['bad','已超时']};
    const [cls,lbl]=stMap[r.status]||['gray',r.status];
    return `<tr>
      <td><b>${esc(r.seatId)}</b></td>
      <td>${esc(r.date)}</td>
      <td>${esc(r.slot.t)}</td>
      <td><span class="pill ${cls}">${lbl}</span></td>
      <td class="actions">${actions.join('')||'—'}</td>
    </tr>`;
  }).join('');
  return `<div class="card">
    <h3>📋 个人预约历史</h3>
    <div class="table-wrap">
    ${mine.length?`<table><thead><tr><th>座位号</th><th>日期</th><th>时间段</th><th>状态</th><th>操作</th></tr></thead><tbody>${rows}</tbody></table>`
      :emptyState('📭','暂无预约记录','去预约座位',`nav('student/seats')`)}
    </div>
  </div>`;
}

function doCheckin(rid){
  const r = state.reservations.find(x=>x.id===rid); if(!r) return;
  r.status='inuse';
  const s = seatById(r.seatId); if(s) s.status='inuse';
  changePoints('签到入座', 5);
  toast('签到成功，已入座 '+r.seatId+'（积分 +5）');
  render();
}
function doRelease(rid){
  const r = state.reservations.find(x=>x.id===rid); if(!r) return;
  const wasReserved = r.status==='reserved';
  r.status = wasReserved?'canceled':'done';
  const s = seatById(r.seatId); if(s && (s.status==='reserved'||s.status==='inuse')) s.status='free';
  if(!wasReserved) changePoints('按时释放座位', 5);
  toast(wasReserved?'已取消预约，座位已释放':'已释放座位（积分 +5），欢迎下次再来');
  render();
}
function doTimeout(rid){
  const r = state.reservations.find(x=>x.id===rid); if(!r) return;
  r.status='expired';
  const s = seatById(r.seatId); if(s) s.status='free';
  addViolation(r.userId, r.userName, '超时未签到', '预约 '+r.seatId+' 后未在规定时间内签到');
  changePoints('超时未签到', -20);
  toast('已模拟超时：座位释放并记录 1 次违约（积分 -20）','warn');
  render();
}

function openAppeal(vid){

function submitAppeal(vid){
  const txt = document.getElementById('appealText').value.trim();

  toast('申诉已提交，等待管理员审核');
  closeModal(); render();
}

// 从预约记录聚合出学生排行榜（动态）
function hoursOf(slot){
  const m = String(slot.t||'').match(/(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})/);
  if(!m) return 2;
  const start = +m[1] + +m[2]/60, end = +m[3] + +m[4]/60;
  const diff = end - start;
  return diff>0 ? diff : diff+24;
}
function buildRanking(){
  const map = {};
  state.reservations.forEach(r=>{
    if(r.status==='canceled') return;
    if(!map[r.userId]) map[r.userId] = {name:r.userName, id:r.userId, count:0, hours:0};
    map[r.userId].count++;
    map[r.userId].hours += hoursOf(r.slot);
  });
  return Object.values(map).sort((a,b)=>b.count-a.count || b.hours-a.hours).slice(0,10);
}

function viewAdminDashboard(){
  const total = state.seats.length;
  const free = state.seats.filter(s=>s.status==='free').length;
  const reserved = state.seats.filter(s=>s.status==='reserved').length;
  const inuse = state.seats.filter(s=>s.status==='inuse').length;
  const usage = total?Math.round((reserved+inuse)/total*100):0;
  const violCount = state.violations.length;
  const pendingAppeal = state.violations.filter(v=>v.appealStatus==='pending').length;

  const roomUsage = state.rooms.map(r=>{
    const ss = state.seats.filter(s=>s.room===r.name);
    const used = ss.filter(s=>s.status!=='free').length;
    return {name:r.name, pct: ss.length?Math.round(used/ss.length*100):0};
  }).sort((a,b)=>b.pct-a.pct);

  const rank = buildRanking();
  const rankRows = rank.length ? rank.map((p,i)=>`
    <tr><td>${i<3?['🥇','🥈','🥉'][i]:i+1}</td><td>${esc(p.name)}</td><td>${esc(p.id)}</td><td>${p.count} 次</td><td>${Math.round(p.hours)} 小时</td></tr>`).join('')
    : `<tr><td colspan="5">${emptyState('📭','暂无使用数据，产生预约后自动生成排行榜')}</td></tr>`;

  return `
  <div class="grid stat-grid">
    <div class="stat blue"><div class="num" data-target="${total}">0</div><div class="lbl">座位总数</div><div class="delta up">↑ 稳定</div></div>
    <div class="stat green"><div class="num" data-target="${free}">0</div><div class="lbl">空闲座位</div><div class="delta up">↑ ${free} 个可约</div></div>
    <div class="stat amber"><div class="num" data-target="${reserved}">0</div><div class="lbl">已预约</div><div class="delta up">↑ 预约中</div></div>
    <div class="stat red"><div class="num" data-target="${inuse}">0</div><div class="lbl">使用中</div><div class="delta down">↓ 高峰时段</div></div>
    <div class="stat teal"><div class="num" data-target="${usage}" data-suffix="%">0</div><div class="lbl">座位使用率</div><div class="delta up">↑ ${usage}%</div></div>
    <div class="stat red"><div class="num" data-target="${violCount}">0</div><div class="lbl">违约记录</div><div class="delta">⏳ ${pendingAppeal} 条待处理申诉</div></div>
  </div>

  <div class="grid" style="grid-template-columns:1fr 1fr;margin-top:18px">
    <div class="card"><h3>📈 阅览室使用率</h3>
      ${roomUsage.map(r=>`<div class="bar-row"><div class="name">${esc(r.name)}</div><div class="bar-track"><div class="bar-fill" style="width:${r.pct}%">${r.pct}%</div></div></div>`).join('')}
    </div>
    <div class="card"><h3>🏆 学院使用排行榜</h3>
      ${[['计算机学院',92],['外国语学院',85],['经管学院',71],['机械学院',63],['文学院',55]].map(c=>`<div class="bar-row"><div class="name">${c[0]}</div><div class="bar-track"><div class="bar-fill" style="width:${c[1]}%">${c[1]}%</div></div></div>`).join('')}
    </div>
  </div>

  <div class="card">
    <h3>👨‍🎓 学生使用排行榜 Top10</h3>
    <div class="table-wrap">
    <table><thead><tr><th>排名</th><th>姓名</th><th>学号</th><th>预约次数</th><th>使用时长</th></tr></thead><tbody>${rankRows}</tbody></table>
    </div>
  </div>`;
}

function validateZones(){
  const checked = ZONES.filter(z=>document.getElementById('rmZone_'+z).checked);
  if(checked.length===0){ toast('请至少选择一种区域','warn'); }
}
function addRoom(){ openModal(roomForm(null,true)); }
function editRoom(id){ const r=state.rooms.find(x=>x.id===id); if(r) openModal(roomForm(r,false)); }

function createRoom(){
  const name = document.getElementById('rmName').value.trim();
  const floor = +document.getElementById('rmFloor').value;
  const zones = ZONES.filter(z=>document.getElementById('rmZone_'+z).checked);
  const seatCount = +document.getElementById('rmSeats').value || 24;
  const openTime = document.getElementById('rmOpen').value.trim() || '08:00 - 22:00';
  if(!name){ toast('请输入阅览室名称','warn'); return; }
  if(state.rooms.some(r=>r.name===name)){ toast('阅览室名称已存在','err'); return; }
  if(zones.length===0){ toast('请至少选择一种区域','warn'); return; }
  const roomNo=(name.match(/\d+/)||['?'])[0];
  // 座位号去重：若前缀已存在则中止
  if(state.seats.some(s=>s.id.startsWith(roomNo+'-'))){ toast('座位号前缀 '+roomNo+'-xx 已存在，请更换阅览室名称','err'); return; }
  const room = {id:'R'+(++state.roomId), name, floor, zones, seatCount, openTime};
  state.rooms.push(room);
  // 自动生成座位（冲突则跳过）
  for(let i=1;i<=seatCount;i++){
    const id = roomNo+'-'+String(i).padStart(2,'0');
    if(state.seats.some(s=>s.id===id)) continue;
    const zone = zones.length===1 ? zones[0] : (i<=Math.ceil(seatCount/2)?zones[0]:zones[1]);
    state.seats.push({id, floor, room:name, roomNo, zone, status:'free', holder:null});
  }
  toast(`新增阅览室成功：${name}（${seatCount} 个座位）`);
  closeModal(); render();
}
function saveRoom(id){
  const r=state.rooms.find(x=>x.id===id); if(!r) return;
  const newName = document.getElementById('rmName').value.trim();
  const newFloor = +document.getElementById('rmFloor').value;
  const newZones = ZONES.filter(z=>document.getElementById('rmZone_'+z).checked);
  if(!newName){ toast('请输入阅览室名称','warn'); return; }
  if(state.rooms.some(x=>x.name===newName && x.id!==id)){ toast('阅览室名称已存在','err'); return; }
  if(newZones.length===0){ toast('请至少选择一种区域','warn'); return; }
  const oldName = r.name;
  r.name=newName; r.floor=newFloor; r.zones=newZones; r.openTime=document.getElementById('rmOpen').value.trim()||r.openTime;
  state.seats.forEach(s=>{ if(s.room===oldName){ s.room=newName; s.floor=newFloor; } });
  toast('阅览室 '+newName+' 已更新'); closeModal(); render();
}
function delRoom(id){
  const r = state.rooms.find(x=>x.id===id); if(!r) return;
  const seats = state.seats.filter(s=>s.room===r.name);
  const seatIds = new Set(seats.map(s=>s.id));
  // 存在待签到/使用中的预约时禁止删除
  const active = state.reservations.filter(x=>seatIds.has(x.seatId) && (x.status==='reserved'||x.status==='inuse'));
  if(active.length){ toast(`阅览室「${r.name}」存在 ${active.length} 条进行中的预约，禁止删除`,'err'); return; }
  if(seats.length>0){
    if(!confirm(`阅览室「${r.name}」下还有 ${seats.length} 个座位，删除阅览室将一并删除这些座位。\n确认继续删除？`)) return;
    state.seats = state.seats.filter(s=>s.room!==r.name);
  }else{
    if(!confirm(`确认删除阅览室「${r.name}」吗？`)) return;
  }
  state.rooms = state.rooms.filter(x=>x.id!==id);
  toast('已删除阅览室 '+r.name); render();
}

function joinQueue(seatId){
  if(state.myQueue){ toast('您已在排队中，请先退出当前队列','warn'); return; }
  const q = state.queue.find(x=>x.seatId===seatId);
  const pos = q ? q.waiting+1 : 1;
  state.myQueue = {seatId, pos};
  if(q) q.waiting++;
  state.messages.unshift({id:'M'+Date.now(), type:'排队', title:'已加入排队', desc:`您已加入座位 ${seatId} 的排队队列，当前排第 ${pos} 位`, time:'刚刚', unread:true});

function leaveQueue(){
  if(!state.myQueue) return;

  if(q && q.waiting>0) q.waiting--;
  state.myQueue=null;
  toast('已退出排队');
  render();
}

function askAI(q){ document.getElementById('aiInput').value=q; sendAI(); }
function sendAI(){
  const input=document.getElementById('aiInput');
  const q=input.value.trim(); if(!q) return;
  const body=document.getElementById('aiBody');
  body.insertAdjacentHTML('beforeend', `<div class="bubble user">${esc(q)}</div>`);
  input.value='';
  body.insertAdjacentHTML('beforeend', `<div class="bubble bot typing">正在思考…</div>`);
  body.scrollTop=body.scrollHeight;
  setTimeout(()=>{
    const typing=body.querySelector('.typing'); if(typing) typing.remove();
    body.insertAdjacentHTML('beforeend', `<div class="bubble bot">${esc(aiReply(q))}</div>`);
    body.scrollTop=body.scrollHeight;
  }, 700);
}
function aiReply(q){
  if(/预约|座位|订/.test(q)) return '您可以前往「座位浏览」页选择空闲座位并预约；同一时间段只能预约 1 个座位哦～';
  if(/签到/.test(q)) return '预约成功后请在所选时间段开始前完成签到；超时未签到会自动释放座位并记违约。';
  if(/违约|黑名单|申诉/.test(q)) return '累计违约 3 次将被自动加入黑名单并暂停预约资格；如有异议可在「违约记录」页提交申诉。';
  if(/积分/.test(q)) return '积分机制为加分项：完成预约 +10、签到 +5、按时释放 +5、超时未签到 -20，可在「积分机制」页查看明细。';
  if(/排队/.test(q)) return '热门座位排队为加分项：在「热门排队」页加入队列，座位释放后按顺序通知。';
  if(/时间|几点|开放|营业/.test(q)) return '阅览室常规开放时间为 08:00 - 22:00；夜间预约规则可在管理端「夜间/节假日规则」配置。';
  if(/你好|hi|hello/i.test(q)) return '你好呀！有什么可以帮您的吗？';
  return '我是演示用 AI 助手（加分项）。您可以问我关于预约、签到、违约、积分、排队、开放时间等问题～';
}

        <button class="about-tab active" id="abt1" onclick="switchAbout('done',this)">✅ 已实现原型</button>

  `);

}
